  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --ink: #0B1A2F;
    --muted: #64748B;
    --line: #d7e0ea;
    --accent: #3182CE;
  }
  body {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI',
                 'PingFang SC', 'Microsoft YaHei', Roboto, Helvetica, Arial, sans-serif;
    background: #eef2f7;
    color: var(--ink);
    padding: 28px 20px 60px;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 1220px; margin: 0 auto; }
  h1 { font-size: 20px; font-weight: 700; margin-bottom: 4px; }
  .sub { color: var(--muted); font-size: 13px; margin-bottom: 20px; }

  .panel {
    background: #fff;
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 16px 18px;
    margin-bottom: 18px;
  }
  .toolbar {
    display: flex;
    flex-wrap: wrap;
    gap: 14px 22px;
    align-items: flex-end;
  }
  .field { display: flex; flex-direction: column; gap: 6px; }
  .field label { font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
  .field input[type="text"], .field select {
    font: inherit;
    font-size: 13px;
    padding: 8px 10px;
    border: 1px solid var(--line);
    border-radius: 7px;
    background: #fff;
    color: var(--ink);
    min-width: 240px;
  }
  .field input[type="range"] { min-width: 200px; accent-color: var(--accent); }
  .field.grow { flex: 1 1 320px; }
  .field.grow input { width: 100%; min-width: 0; }
  input[type="file"] { font-size: 12px; }
  .btn {
    font: inherit;
    font-size: 14px;
    font-weight: 700;
    color: #fff;
    background: linear-gradient(135deg, #1A365D, #3182CE);
    border: 0;
    border-radius: 8px;
    padding: 11px 22px;
    cursor: pointer;
    box-shadow: 0 2px 8px rgba(26,54,93,.25);
  }
  .btn:hover { filter: brightness(1.08); }
  .btn.ghost {
    background: #fff;
    color: var(--ink);
    border: 1px solid var(--line);
    box-shadow: none;
    font-weight: 600;
    font-size: 13px;
    padding: 8px 14px;
  }
  .stage {
    background:
      linear-gradient(45deg, #e6ebf2 25%, transparent 25%, transparent 75%, #e6ebf2 75%),
      linear-gradient(45deg, #e6ebf2 25%, #f4f7fa 25%, #f4f7fa 75%, #e6ebf2 75%);
    background-size: 20px 20px;
    background-position: 0 0, 10px 10px;
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 14px;
  }
  canvas { display: block; width: 100%; height: auto; border-radius: 6px; }
  .meta { display: flex; justify-content: space-between; gap: 12px; font-size: 12px; color: var(--muted); margin-top: 10px; flex-wrap: wrap; }
  .status { font-size: 13px; color: #0F766E; font-weight: 600; min-height: 18px; margin-top: 10px; }
  .hint { font-size: 12px; color: var(--muted); margin-top: 6px; line-height: 1.6; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Banner Maker</h1>
  <p class="sub">背景图 + 上层文字 → 一键导出 PNG。页面所见即所存，导出尺寸 = 画布尺寸。</p>

  <div class="panel">
    <div class="toolbar">
      <div class="field grow">
        <label>主标题 / Title</label>
        <input type="text" id="tTitle" value="AGENT-DRIVEN BUSINESS VALUE" />
      </div>
      <div class="field grow">
        <label>副标题 / Subtitle</label>
        <input type="text" id="tSub" value="Agent Orchestration · AI Infrastructure · Full-Stack Development" />
      </div>
      <div class="field grow">
        <label>左上角 / Eyebrow</label>
        <input type="text" id="tEye" value="YARESTAV / BUILD LOG" />
      </div>
    </div>
    <div class="toolbar" style="margin-top:16px;">
      <div class="field">
        <label>导出倍率 / Scale</label>
        <select id="scale">
          <option value="1" selected>1x · 原生 (1792×592)</option>
          <option value="2">2x · 高清 (3584×1184)</option>
        </select>
      </div>
      <div class="field">
        <label>左上角小字高度 / Eyebrow Y · <span id="eyeTopVal">22%</span></label>
        <input type="range" id="eyeTop" min="4" max="40" step="1" value="22" />
      </div>
      <div class="field">
        <label>更换背景 / Background</label>
        <input type="file" id="bgFile" accept="image/*" />
      </div>
      <button class="btn" id="save">保存为图片 / Save as PNG</button>
      <button class="btn ghost" id="reset">恢复默认</button>
    </div>
    <div class="status" id="status"></div>
  </div>

  <div class="stage">
    <canvas id="cv"></canvas>

  /* ---------- 画布基准 ---------- */
  var BASE_W = 1792, BASE_H = 592;   // 背景图原生尺寸
  var REF_W  = 1456;                 // 设计稿参考宽度（所有字号/间距按 W/REF_W 缩放）

  var cv = document.getElementById('cv');
  var ctx = cv.getContext('2d');
  var statusEl = document.getElementById('status');
  var dimEl = document.getElementById('dim');

  var bgImg = new Image();
  var bgReady = false;
  var currentBg = DEFAULT_BG;

  var FONT = "Inter, 'Segoe UI', system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif";

  /* ---------- 读取输入 ---------- */
  function val(id) { return document.getElementById(id).value; }

  /* ---------- 绘制 ---------- */
  function drawText(W, H) {
    var S = W / REF_W;
    var marginX     = 60 * S;
    var eyebrowSize = 15 * S;
    var titleSize   = 52 * S;
    var subSize     = 19 * S;
    var gap1 = 18 * S;              // eyebrow -> 渐变线
    var ruleW = 64 * S, ruleH = Math.max(2, 3 * S);
    var gap2 = 26 * S;              // 渐变线 -> 主标题
    var gap3 = 22 * S;              // 主标题 -> 副标题

    var total = eyebrowSize + gap1 + ruleH + gap2 + titleSize + gap3 + subSize;
    var blockY = (H - total) / 2;          // 标题组按整块居中（位置不变）
    var ruleY  = blockY + eyebrowSize + gap1;

    ctx.textAlign = 'left';
    ctx.textBaseline = 'top';

    // ① 左上角小字：独立定位（滑块控制距顶部的高度），与下方标题组解耦
    var eyeTopPct = parseFloat(document.getElementById('eyeTop').value);
    if (isNaN(eyeTopPct)) eyeTopPct = 22;
    var eyeY = H * eyeTopPct / 100;
    var maxEyeY = ruleY - eyebrowSize - 6 * S;     // 避免与渐变线重叠
    if (eyeY > maxEyeY) eyeY = maxEyeY;
    if (eyeY < 4 * S) eyeY = 4 * S;

    ctx.fillStyle = '#718096';
    ctx.font = '400 ' + eyebrowSize + 'px ' + FONT;
    ctx.letterSpacing = (0.02 * eyebrowSize) + 'px';
    ctx.fillText(val('tEye'), marginX, eyeY);

    // ② 渐变横线
    var y = ruleY;
    var g = ctx.createLinearGradient(marginX, 0, marginX + ruleW, 0);
    g.addColorStop(0, '#1A365D');
    g.addColorStop(1, '#3182CE');
    ctx.fillStyle = g;
    ctx.fillRect(marginX, y, ruleW, ruleH);
    y += ruleH + gap2;

    // ③ 主标题（单行，不换行）
    ctx.fillStyle = '#0B1A2F';
    ctx.font = '700 ' + titleSize + 'px ' + FONT;
    ctx.letterSpacing = (0.01 * titleSize) + 'px';
    ctx.fillText(val('tTitle'), marginX, y);
    y += titleSize + gap3;

    // ④ 副标题
    ctx.fillStyle = '#334155';
    ctx.font = '400 ' + subSize + 'px ' + FONT;
    ctx.letterSpacing = (0.12 * subSize) + 'px';
    ctx.fillText(val('tSub'), marginX, y);

    ctx.letterSpacing = '0px';
  }

  function render() {
    var k = parseFloat(document.getElementById('scale').value) || 1;
    var W = Math.round(BASE_W * k);
    var H = Math.round(BASE_H * k);

    cv.width = W;
    cv.height = H;
    ctx.clearRect(0, 0, W, H);

    if (bgReady) {
      ctx.imageSmoothingEnabled = true;
      ctx.imageSmoothingQuality = 'high';
      ctx.drawImage(bgImg, 0, 0, W, H);
    }
    drawText(W, H);

    dimEl.textContent = '画布 ' + W + ' × ' + H + ' px';
  }

  /* ---------- 载入图片 ---------- */
  function loadBg(src) {
    return new Promise(function (resolve) {
      bgImg = new Image();
      bgImg.onload = function () { bgReady = true; currentBg = src; resolve(true); };
      bgImg.onerror = function () { bgReady = false; resolve(false); };
      bgImg.src = src;
    });
  }

  /* ---------- 保存 ---------- */
  function save() {
    try {
      cv.toBlob(function (blob) {
        if (!blob) { statusEl.textContent = '导出失败，请重试。'; return; }
        var url = URL.createObjectURL(blob);
        var a = document.createElement('a');
        a.href = url;
        a.download = 'hero-banner.png';
        document.body.appendChild(a);
        a.click();
        a.remove();
        setTimeout(function () { URL.revokeObjectURL(url); }, 3000);
        statusEl.textContent = '已保存：hero-banner.png（' + cv.width + '×' + cv.height + '）';
      }, 'image/png');
    } catch (e) {
      statusEl.textContent = '导出被浏览器拦截：' + e.message;
    }
  }

  /* ---------- 事件 ---------- */
  ['tEye', 'tTitle', 'tSub'].forEach(function (id) {
    document.getElementById(id).addEventListener('input', render);
  });
  document.getElementById('scale').addEventListener('change', render);
  document.getElementById('eyeTop').addEventListener('input', function () {
    document.getElementById('eyeTopVal').textContent = this.value + '%';
    render();
  });

  document.getElementById('bgFile').addEventListener('change', function (e) {
    var f = e.target.files && e.target.files[0];
    if (!f) return;
    var r = new FileReader();
    r.onload = function () {
      loadBg(r.result).then(function (ok) {
        render();
        statusEl.textContent = ok ? '已更换背景：' + f.name : '这张图无法读取。';
      });
    };
    r.readAsDataURL(f);
  });

  document.getElementById('reset').addEventListener('click', function () {
    document.getElementById('tTitle').value = 'AGENT-DRIVEN BUSINESS VALUE';
    document.getElementById('tSub').value = 'Agent Orchestration · AI Infrastructure · Full-Stack Development';
    document.getElementById('tEye').value = 'YARESTAV / BUILD LOG';
    document.getElementById('scale').value = '1';
    document.getElementById('eyeTop').value = '22';
    document.getElementById('eyeTopVal').textContent = '22%';
    loadBg(DEFAULT_BG).then(render);
    statusEl.textContent = '已恢复默认。';
  });

  document.getElementById('save').addEventListener('click', save);

  /* ---------- 初始化：等字体 + 背景就绪再画 ---------- */
  Promise.all([
    document.fonts.load('400 100px Inter').catch(function () {}),
    document.fonts.load('700 100px Inter').catch(function () {}),
    loadBg(DEFAULT_BG)
  ]).then(function () {
    render();
    statusEl.textContent = '就绪，可以点「保存为图片」。';
  });
})();
</script>
